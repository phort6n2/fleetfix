name: Refresh Google reviews

# NOTE: scheduled workflows only run from the DEFAULT branch. On a feature
# branch GitHub does not register this workflow at all — it will not appear in
# the Actions tab and cannot be dispatched. Merge to the default branch before
# expecting the cron to fire.
on:
  schedule:
    - cron: '17 9 * * 1'      # Mondays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-reviews
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Google reviews
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node landing/fetch-reviews.cjs

      - name: Rebuild site
        run: npm run build:landing

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add landing/reviews.json quote-site
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Refresh Google reviews"
          git push
